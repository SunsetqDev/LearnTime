<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Фокус — учебный таймер по методу Помодоро для школьников и студентов."
    />
    <meta name="theme-color" content="#F2EEE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Фокус</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('focus.settings');
          var theme = raw ? JSON.parse(raw).state.theme : 'system';
          if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
